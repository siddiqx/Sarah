version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sarah-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sarah
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sarah-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/sarah
      DEBUG: "true"
      SECRET_KEY: "dev-secret-key-change-in-production"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  code-runner:
    build:
      context: ./services/code-runner
      dockerfile: Dockerfile
    container_name: sarah-code-runner
    ports:
      - "8001:8001"
    volumes:
      - ./services/code-runner:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sarah-web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
